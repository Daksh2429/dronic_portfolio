<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DroniC | Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" rel="stylesheet">
  <style>
    body {
  font-family: 'Poppins', sans-serif;
}

.gallery {
  column-count: 3;
  column-gap: 1rem;
}

.gallery-item {
  break-inside: avoid;
  margin-bottom: 20px;
}

.gallery-card {
  overflow: hidden;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  transition: 0.3s ease;
}

.gallery-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.2);
}

.gallery-card img,
.gallery-card video {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 0;
}

.filter-btn.active {
  background-color: #007bff;
  color: white;
}

  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
<a class="navbar-brand d-flex align-items-center" href="index.html">
  <img src="assets/images/IMG_2908.PNG" alt="DroniC Logo" style="height: 40px; margin-right: 10px;">
  DroniC
</a>

</nav>

<section class="container my-5">
  <h2 class="text-center mb-4">My Drone Work</h2>

  <!-- Filter Buttons -->
  <div class="text-center mb-4">
    <button class="btn btn-outline-primary mx-1 filter-btn active" data-filter="all">All</button>
    <button class="btn btn-outline-primary mx-1 filter-btn" data-filter="photo">Photos</button>
    <button class="btn btn-outline-primary mx-1 filter-btn" data-filter="video">Videos</button>
  </div>

  <!-- Gallery Grid -->
  <div class="row">
    <div class="col-12">
      <div class="gallery d-flex flex-wrap" style="column-count: 3; column-gap: 1rem;">

        <!-- Photo 1 -->
       <div class="gallery-item photo">
  <div class="gallery-card">
    <a href="assets/images/IMG_2877 (1).JPG" class="glightbox" data-gallery="gallery1">
      <img src="assets/images/IMG_2877 (1).JPG" alt="Drone Photo 1">
    </a>
  </div>
</div>

        <!-- Photo 2 -->
       <div class="gallery-item photo">
  <div class="gallery-card">
    <a href="assets/images/IMG_2884.JPG" class="glightbox" data-gallery="gallery1">
      <img src="assets/images/IMG_2884.JPG" alt="Drone Photo 1">
    </a>
  </div>
</div>
        <!-- Video -->
        <div class="gallery-item video">
  <div class="gallery-card">
    <video controls>
      <source src="assets/videos/dji_fly_20240617_140908_115_1719123863502_video.mov" type="video/mp4">
    </video>
    <a href="assets/videos/dji_fly_20240617_140908_115_1719123863502_video.mov" class="glightbox" data-gallery="gallery1" style="display:none;"></a>
  </div>
</div>
</section>

<footer class="bg-dark text-white text-center py-4">
  <p class="mb-1">&copy; 2025 DroniC by Daksh Patel. All rights reserved.</p>
  <a href="https://www.instagram.com/droni_.c" target="_blank" class="text-white text-decoration-none">
    <i class="bi bi-instagram" style="font-size: 1.5rem;"></i> Follow me on Instagram
  </a>
</footer>

<!-- JS Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
<script>
  const lightbox = GLightbox({ selector: '.glightbox' });

  document.addEventListener("DOMContentLoaded", function () {
    const buttons = document.querySelectorAll(".filter-btn");
    const items = document.querySelectorAll(".gallery-item");

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        const filter = btn.dataset.filter;
        items.forEach(item => {
          if (filter === "all" || item.classList.contains(filter)) {
            item.style.display = "block";
          } else {
            item.style.display = "none";
          }
        });
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      });
    });
  });
</script>

</body>
</html>
